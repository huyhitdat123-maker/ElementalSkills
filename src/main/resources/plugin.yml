name: ElementalSkills
version: 2.0.0
main: com.elementalskills.ElementalSkillsPlugin
api-version: '1.21'
description: Plugin 20 He Nguyen To - 100 Chieu Thuc Sinh Ton Paper 1.21.11
commands:
  batkinang:
    description: Bat hoac tat che do chien dau 5 chieu nguyen to
    aliases: [bkn, combat]
    usage: /batkinang
  chonhe:
    description: Mo bang chon 20 He Nguyen To (Admin)
    aliases: [he, element]
    permission: elementalskills.admin
    usage: /chonhe
  dongy:
    description: Chap nhan he nguyen to vua thuc tinh tu Giay Thuc Tinh
    usage: /dongy
  tuchoi:
    description: Tu choi he nguyen to vua quay duoc (toi da 2 lan)
    usage: /tuchoi
  givegiay:
    description: Cap Giay Thuc Tinh cho nguoi choi (Admin)
    permission: elementalskills.admin
    usage: /givegiay <ten_nguoi_choi> [so_luong]
permissions:
  elementalskills.admin:
    default: op
